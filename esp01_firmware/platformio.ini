; PlatformIO 工程配置 —— ESP-01S (1MB Flash) → 华为云 IoTDA
;
; 首次编译时 PlatformIO 会自动下载 esp8266 平台工具链和 PubSubClient 库，
; 体积几百 MB，慢是正常的。

[env:esp01]
platform  = espressif8266
board     = esp01_1m          ; ESP-01S:25Q80 = 1MB(老 ESP-01 是 512KB,改为 esp01)

framework = arduino

upload_speed  = 115200
monitor_speed = 115200

lib_deps = knolleary/PubSubClient@^2.8

; 把 MQTT 包缓冲从默认 256 提到 512 —— 我们的 JSON + 长 Topic 装不下 256
build_flags = -D MQTT_MAX_PACKET_SIZE=512
